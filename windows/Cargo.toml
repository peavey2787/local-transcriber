[package]
name = "local-stt-rs"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "Windows background speech-to-text tray app powered by NVIDIA Parakeet TDT"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
bzip2 = "0.5"
cpal = "0.15"
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.31", default-features = true, features = ["default_fonts"] }
egui = "0.31"
env_logger = "0.11"
global-hotkey = "0.8"
log = "0.4"
muda = "0.15"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
# Use shared Sherpa/ONNX libraries so the Windows package can bundle the native runtime.
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["shared"] }
tar = "0.4"
tray-icon = "0.19"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[package.metadata.winresource]
FileDescription = "Local speech-to-text powered by NVIDIA Parakeet TDT"
OriginalFilename = "local-stt.exe"
ProductName = "local-stt"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
