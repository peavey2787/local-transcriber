[workspace]
members = [
    "crates/transcriber-core",
    "crates/transcriber-ui",
    "apps/linux",
    "apps/windows",
]
default-members = [
    "crates/transcriber-core",
    "crates/transcriber-ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
arboard = "3"
bzip2 = "0.5"
cpal = "0.15"
crossbeam-channel = "0.5"
dirs = "6"
eframe = { version = "0.31", default-features = true, features = ["default_fonts"] }
egui = "0.31"
env_logger = "0.11"
log = "0.4"
muda = "0.15"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
sherpa-onnx = { version = "=1.13.4", default-features = false, features = ["shared"] }
tar = "0.4"
tray-icon = "0.19"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
